name: Wordstat — узкие сиды (наши темы)

# Гонит Wordstat-дискавери строго по нашим сидам (seeds-kontur.json) в отдельный
# namespace (discoveries/kontur/), не пересекаясь с широким набором seeds.json.
#
# Прежнее название «Контур-фокус» путало: «Контур» — это и заказчик, и
# слово из «контур A / контур B» в docs/wordstat.md, где контуры означают
# ровно обратное — широкий и узкий наборы сидов. В названии осталось то,
# что отличает этот workflow от еженедельного: узкие сиды по нашим темам.
#
# Пути данных (WS_NS=kontur, seeds-kontur.json, discoveries/kontur/)
# намеренно не тронуты: переименование увело бы уже собранные выгрузки в
# сторону, а имя каталога пользователю не видно.

on:
  schedule:
    # Два ежедневных прогона были временным автодобором: MAX_REQUESTS брал
    # ≤90 сидов за раз, потому что в discover.mjs была зашита чужая квота
    # 100 req/час. По факту квота 1000/час — все 206 сидов забираются одним
    # прогоном, и держать ежедневное расписание больше незачем.
    # GitHub может задержать запуск на 5–20 мин (сегодня задержал на 2,5 часа).
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      num_phrases:
        description: "Сколько фраз возвращать на seed (макс. 2000)"
        required: false
        default: "2000"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    concurrency:
      group: wordstat-kontur
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Discover trends (по seeds-kontur.json)
        env:
          YC_API_KEY: ${{ secrets.YC_API_KEY }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          REGION_ID: "225"
          NUM_PHRASES: ${{ inputs.num_phrases || '2000' }}
          SEEDS_FILE: "seeds-kontur.json"
          WS_NS: "kontur"
        run: node scripts/wordstat/discover.mjs

      - name: Diff vs previous snapshot (namespace kontur)
        env:
          WS_NS: "kontur"
        run: node scripts/wordstat/diff-snapshots.mjs

      # kontur гоняется ежедневно — без ретенции именно он раздувает
      # дерево быстрее всех. Строго после diff: тому нужны две последние
      # датированные папки.
      - name: Prune history (ретенция discoveries/kontur)
        run: node scripts/wordstat/prune-history.mjs

      - name: Commit refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/wordstat/discoveries/kontur/
          if git diff --cached --quiet; then
            echo "wordstat-kontur: нет изменений"
            exit 0
          fi
          git commit -m "wordstat-kontur: refresh $(date -u +%Y-%m-%d)"
          # Push с ребейзом: main мог уйти вперёд, пока шёл сбор (~30 мин).
          # Раньше без этого push отклонялся («fetch first») и собранные
          # данные Wordstat терялись. Данные аддитивные (файл на сид),
          # конфликтов нет — просто накатываем свой коммит поверх свежего main.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "push ok (попытка $i)"
              exit 0
            fi
            echo "push отклонён, попытка $i — ребейз на свежий ${{ github.ref_name }}"
            git pull --rebase --autostash origin ${{ github.ref_name }} || exit 1
            sleep 3
          done
          echo "push не удался после 5 попыток"; exit 1
