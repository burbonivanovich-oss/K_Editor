name: watch-sheet

# Опрос таблицы редакции. Расписание в UTC, редакция живёт по GMT+5:
#   04:00-13:00 UTC = 09:00-18:00 по редакции, по будням, раз в час;
#   18:17 UTC       = 23:17 по редакции, один проход за все нерабочие часы.
# Минуты не круглые намеренно: в :00 расписания запускает пол-GitHub.
on:
  schedule:
    - cron: '7 4-13 * * 1-5'
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      - name: Прочитать решения редактора и обновить таблицу
        env:
          DRIVE_AUTH: oauth
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GOOGLE_DOCS_FOLDER_ID: ${{ secrets.GOOGLE_DOCS_FOLDER_ID }}
        run: |
          SHEET=$(node -p "require('./src/data/editorial-cycle.json').drive.sheetId || ''")
          if [ -z "$SHEET" ]; then
            echo "Цикл не заведён — опрашивать нечего" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          node scripts/drive-sync.mjs pull --sheet-id "$SHEET" > /tmp/pull.json
          node scripts/cycle-state.mjs apply-decisions --file /tmp/pull.json > /tmp/changes.json
          node scripts/drive-sync.mjs set-cells --sheet-id "$SHEET" --updates "$(node scripts/cycle-state.mjs sheet-sync)"
          node scripts/drive-sync.mjs set-row-dropdowns --sheet-id "$SHEET" --updates "$(node scripts/cycle-state.mjs row-decisions)"
          echo "### Сверка таблицы с состоянием" >> $GITHUB_STEP_SUMMARY
          node scripts/verify-sheet.mjs --sheet-id "$SHEET" >> $GITHUB_STEP_SUMMARY 2>&1
          echo "### Что изменилось" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat /tmp/changes.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          node scripts/nudge-editors.mjs --sheet-id "$SHEET" >> $GITHUB_STEP_SUMMARY 2>&1

      - name: Закоммитить состояние цикла
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/editorial-cycle.json
          git diff --cached --quiet || git commit -m "watch-sheet: решения редактора применены"
          git push
