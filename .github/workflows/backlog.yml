name: Бэклог тем — ресерч и сборка кандидатов

# Часть рутины A0 — детерминированная половина: от сбора спроса до
# topic-backlog.json в репозитории. НЕ публикует таблицу в Drive — до
# 2026-08-08 этот workflow сам вызывал drive-sync.mjs init-backlog и клал
# в реальную таблицу редактора сырые фразы Wordstat («локальный модуль
# честный знак») как есть, в колонку «Тема»: скрипт (generate-backlog.mjs)
# принципиально без ИИ и не может превратить фразу в заголовок статьи.
# Публикацию с реальными заголовками делает сессия Клода (не этот
# workflow) — еженедельная Routine, которая читает свежесобранный
# topic-backlog.json, формулирует «Тема» по каждому кандидату и только
# тогда вызывает drive-sync.mjs init-backlog. Устройство — Шаг 1–2
# .claude/commands/cycle-backlog.md.
#
# Цепочка (этот workflow):
#   discover           свежая выгрузка Wordstat по сидам
#   enrich-candidates  помесячная динамика по кандидатам (12 месяцев)
#   generate-backlog   отбор тем с обоснованием «почему сейчас», коммит
#
# Динамика вместо diff-а неделя-к-неделе: topRequests не отдаёт срез задним
# числом, второй снапшот появился бы только через неделю. /dynamics отдаёт
# 12 месяцев истории сразу, и рост считается в первый же день.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Сколько тем в бэклоге"
        required: false
        type: string
        default: "15"
      top_n:
        description: "Сколько фраз проверить на динамику (= столько же квот Wordstat)"
        required: false
        type: string
        default: "700"
  schedule:
    # Понедельник, 06:00 UTC — после weekly-обновления Wordstat в 04:00,
    # чтобы бэклог собирался на свежих данных, а не на прошлонедельных.
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  backlog:
    runs-on: ubuntu-latest
    concurrency:
      group: backlog
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"

      - name: Выгрузка Wordstat по сидам
        env:
          YC_API_KEY: ${{ secrets.YC_API_KEY }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          REGION_ID: "225"
        # Уже собранные за сегодня сиды скрипт пропускает, так что повторный
        # запуск в тот же день квоту не жжёт.
        run: node scripts/wordstat/discover.mjs

      - name: Динамика по кандидатам
        env:
          YC_API_KEY: ${{ secrets.YC_API_KEY }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          REGION_ID: "225"
          # 176 сидов на discover + 700 сюда = 876 из часовой тысячи.
          # Измерения копятся между прогонами: пул ~8500 фраз закрывается
          # примерно за дюжину запусков, а не мерится заново каждый раз.
          TOP_N: ${{ inputs.top_n || '700' }}
        run: node scripts/wordstat/enrich-candidates.mjs

      - name: Сборка бэклога
        id: gen
        env:
          # Через env, не ${{ }} внутри run: — тот же класс риска, что и
          # в editor-request.yml: значение подставляется в текст скрипта до
          # того, как его увидит shell. Здесь inputs.limit заполняет владелец
          # репозитория через Actions UI, риск ниже, но паттерн один на все
          # workflow — держим его единообразно, а не только там, где ввод
          # внешний.
          LIMIT: ${{ inputs.limit || '40' }}
        run: |
          set -euo pipefail
          node scripts/topics/generate-backlog.mjs --limit "${LIMIT}" | tee /tmp/backlog.log
          COUNT=$(node -e "const j=require('./src/data/topic-backlog.json');console.log((j.candidates||[]).length)")
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

      - name: Коммит
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/
          if git diff --cached --quiet; then
            echo "изменений нет"
            exit 0
          fi
          git commit -m "backlog: сборка $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git push origin HEAD:${{ github.ref_name }} && exit 0
            git pull --rebase --autostash origin ${{ github.ref_name }} || exit 1
          done
          exit 1

      - name: Отчёт
        if: always()
        run: |
          {
            echo "## Бэклог тем"
            echo ""
            echo "Тем отобрано: **${{ steps.gen.outputs.count || '—' }}**"
            echo ""
            echo "> Таблица в Drive не публикуется этим workflow — см. комментарий"
            echo "> вверху файла. Публикацию с заголовками делает еженедельная"
            echo "> Routine рутины A0 (.claude/commands/cycle-backlog.md)."
            echo ""
            echo '```'
            sed -r 's/\x1b\[[0-9;]*m//g' /tmp/backlog.log 2>/dev/null | tail -40 || echo "(лог пуст)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
