name: CI

# Проверки без внешних зависимостей и секретов — синтаксис скриптов,
# юнит-тесты машины состояний, регрессионные аудиты контента. Раньше
# таких проверок при PR не было: битый скрипт или баг в cycle-state.mjs
# обнаруживались только вручную, при запуске в Actions на реальных данных.
#
# Секретов (YC_API_KEY, GOOGLE_DOCS_KEY и т. п.) здесь нет и не нужно —
# всё ниже работает на репозитории как есть.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Синтаксис всех скриптов (node --check)
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            node --check "$f" || fail=1
          done < <(find scripts -name '*.mjs' -print0)
          exit $fail

      - name: Юнит-тесты
        run: npm test

      - name: Тесты не меняют рабочее дерево (T-01)
        # До фикса runGate(cwd) в release-article.mjs npa-audit и
        # check-blog-links гонялись тестами по настоящему репозиторию
        # (у них не было своих оверрайдов путей) — каждый npm test
        # переписывал src/data/factcheck/audit/npa-references.json
        # свежим таймстампом. Явная проверка вместо того, чтобы
        # полагаться на то, что это заметят при ревью diff'а.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "npm test изменил рабочее дерево — тест не герметичен:"
            git status --porcelain
            git diff | head -100
            exit 1
          fi

      - name: Аудит НПА-ссылок (--strict)
        run: node scripts/factcheck/audit-npa-references.mjs --strict

      - name: Битые внутренние ссылки блога
        run: node scripts/audit/check-blog-links.mjs

      - name: Хеш факчек-маркеров соответствует закоммиченным статьям (--strict)
        run: node scripts/factcheck/audit-marker-hashes.mjs --strict


      - name: Факчек доведён до отчёта у каждой выпущенной статьи (--strict)
        run: node scripts/factcheck/audit-marker-results.mjs --strict

      # Связка факчека целиком, тем же валидатором, что у гейта и релиза
      # (C-01). Шаги выше проверяют маркер по трём полям — то есть
      # утверждение о проверке; здесь перепроверяются доказательства,
      # покрытие, контракт артефактов и то, что вердикт маркера следует
      # из утверждений отчёта. Статьи, зафакчеканные по предыдущему
      # контракту, перечислены в src/data/factcheck/legacy-allowlist.json:
      # их состояние печатается, но красным становится только то, чего в
      # списке нет. Список обязан сокращаться, а не расти.
      - name: Доказательства факчека перепроверены (--strict)
        run: node scripts/factcheck/audit-bundles.mjs --strict

      # Живые гейты по всему корпусу, а не сохранённые вердикты.
      #
      # CI до этого шага доверял артефактам: маркеру, отчёту, записи
      # оценки. Всё это следы прошлых проверок, и они не знают про
      # согласованность корпуса, срок проверки, контракт материала и
      # редакционные требования — те считаются заново по тексту статьи.
      # Пока шага не было, `gates --audit` печатал «красное есть у:
      # Факчек, Контракт материала» и возвращал ноль.
      - name: Гейты по корпусу пересчитываются заново
        run: node scripts/gates.mjs --audit

      # Реестр повторяемых фактов: форма записей и отсутствие
      # противоречий между статьями. Сверка цитат с живыми страницами —
      # отдельным шагом (--verify), он требует сети и вынесен в ночной
      # прогон: падение сети не должно красить PR.
      - name: Реестр фактов и согласованность корпуса
        run: node scripts/factcheck/fact-registry.mjs

      # Долг корпуса может только сокращаться. Показатели замкнутости
      # сверяются с записанными: рост — красное, снижение — обновление
      # записи. Без этого шага 1000+ неклассифицированных единиц молча
      # оставались бы «предупреждением» и росли бы дальше.
      - name: Долг корпуса не вырос
        run: node scripts/factcheck/debt-ratchet.mjs --check

      # E-03: задача на актуализацию не должна превращаться в новую
      # статью. Тип задачи и исходная ссылка фиксируются на intake;
      # здесь проверяется, что материал по теме соответствует типу.
      - name: Тип задачи сходится с работой (--strict)
        run: node scripts/check-task-invariants.mjs --strict
      - name: SEO без замечаний во всех статьях (P0 и P1)
        run: node scripts/audit/check-seo-all.mjs --strict
